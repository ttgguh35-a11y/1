<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ElectroLab - 大学物理电磁场小游戏平台</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#050816;
    overflow:hidden;
    color:white;
}

canvas{
    display:block;
}

#bgCanvas{
    position:fixed;
    left:0;
    top:0;
    z-index:0;
}

#ui{
    position:relative;
    z-index:10;
    width:100vw;
    height:100vh;
}

.screen{
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.active{
    display:flex;
}

.title{
    font-size:56px;
    color:#00e5ff;
    text-shadow:0 0 20px #00e5ff;
    margin-bottom:15px;
}

.subtitle{
    color:#9bdcff;
    margin-bottom:40px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,280px);
    gap:20px;
}

.btn{
    background:rgba(0,255,255,0.08);
    border:1px solid #00ffff;
    color:#00ffff;
    padding:20px;
    font-size:20px;
    border-radius:14px;
    cursor:pointer;
    transition:0.3s;
    text-align:center;
    box-shadow:0 0 15px rgba(0,255,255,0.2);
}

.btn:hover{
    transform:translateY(-5px) scale(1.03);
    background:rgba(0,255,255,0.15);
    box-shadow:0 0 25px #00ffff;
}

.backBtn{
    position:absolute;
    top:20px;
    left:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#00d9ff;
    color:black;
    cursor:pointer;
    font-weight:bold;
}

.gameTitle{
    font-size:40px;
    color:#00ffff;
    margin-bottom:15px;
}

.info{
    color:#8cdcff;
    margin-bottom:20px;
}

.gameCanvas{
    border:2px solid #00ffff;
    background:#07111f;
    box-shadow:0 0 30px rgba(0,255,255,0.3);
    border-radius:10px;
}

.controls{
    margin-top:20px;
    display:flex;
    gap:15px;
}

.controlBtn{
    padding:12px 20px;
    background:#00d9ff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.hud{
    position:absolute;
    right:20px;
    top:20px;
    color:#00ffff;
    font-size:18px;
}

</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div id="ui">

    <!-- 首页 -->
    <div id="home" class="screen active">

        <div class="title">ElectroLab</div>
        <div class="subtitle">大学物理 · 电磁场小游戏平台</div>

        <div class="menu">

            <div class="btn" onclick="openGame('electron')">
                ⚡ 电子风暴
            </div>

            <div class="btn" onclick="openGame('magnetic')">
                🧲 磁场迷宫
            </div>

            <div class="btn" onclick="openGame('faraday')">
                🔋 法拉第实验室
            </div>

            <div class="btn" onclick="openGame('accelerator')">
                ☢ 粒子加速器
            </div>

            <div class="btn" onclick="openGame('railgun')">
                🚀 电磁炮
            </div>

        </div>

    </div>

    <!-- 游戏界面 -->
    <div id="gameScreen" class="screen">

        <button class="backBtn" onclick="goHome()">
            ← 返回主页
        </button>

        <div class="gameTitle" id="gameTitle"></div>

        <div class="info" id="gameInfo"></div>

        <canvas id="gameCanvas" class="gameCanvas" width="900" height="500"></canvas>

        <div class="controls">
            <button class="controlBtn" onclick="resetGame()">重新开始</button>
        </div>

        <div class="hud" id="hud"></div>

    </div>

</div>

<script>

/* ================= 背景粒子 ================= */

const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");

function resize(){
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
}
resize();

window.addEventListener("resize",resize);

let particles=[];

for(let i=0;i<120;i++){
    particles.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        r:Math.random()*2,
        dx:(Math.random()-0.5)*0.5,
        dy:(Math.random()-0.5)*0.5
    });
}

function animateBG(){

    bgCtx.fillStyle="#050816";
    bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

    particles.forEach(p=>{

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>bgCanvas.width) p.dx*=-1;
        if(p.y<0||p.y>bgCanvas.height) p.dy*=-1;

        bgCtx.beginPath();
        bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
        bgCtx.fillStyle="#00ffff";
        bgCtx.fill();

    });

    requestAnimationFrame(animateBG);
}

animateBG();

/* ================= 页面逻辑 ================= */

const home=document.getElementById("home");
const gameScreen=document.getElementById("gameScreen");
const gameTitle=document.getElementById("gameTitle");
const gameInfo=document.getElementById("gameInfo");
const hud=document.getElementById("hud");

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let currentGame="";

function openGame(name){

    currentGame=name;

    home.classList.remove("active");
    gameScreen.classList.add("active");

    if(name==="electron"){
        gameTitle.innerText="⚡ 电子风暴";
        gameInfo.innerText="控制电子在电磁场中运动";
        initElectronStorm();
    }

    if(name==="magnetic"){
        gameTitle.innerText="🧲 磁场迷宫";
        gameInfo.innerText="利用磁极控制小球";
        initMagneticMaze();
    }

    if(name==="faraday"){
        gameTitle.innerText="🔋 法拉第实验室";
        gameInfo.innerText="移动磁铁产生感应电流";
        initFaraday();
    }

    if(name==="accelerator"){
        gameTitle.innerText="☢ 粒子加速器";
        gameInfo.innerText="让粒子不断加速";
        initAccelerator();
    }

    if(name==="railgun"){
        gameTitle.innerText="🚀 电磁炮";
        gameInfo.innerText="调节能量发射炮弹";
        initRailgun();
    }
}

function goHome(){
    gameScreen.classList.remove("active");
    home.classList.add("active");
}

function resetGame(){
    openGame(currentGame);
}

/* ================= 1 电子风暴 ================= */

function initElectronStorm(){

    let electron={
        x:100,
        y:250,
        vx:2,
        vy:0
    };

    window.onkeydown=(e)=>{

        if(e.key==="ArrowUp") electron.vy-=0.5;
        if(e.key==="ArrowDown") electron.vy+=0.5;

    };

    function loop(){

        if(currentGame!=="electron") return;

        ctx.fillStyle="#07111f";
        ctx.fillRect(0,0,900,500);

        electron.x+=electron.vx;
        electron.y+=electron.vy;

        electron.vy+=0.02;

        if(electron.y>500) electron.y=0;

        ctx.beginPath();
        ctx.arc(electron.x,electron.y,10,0,Math.PI*2);
        ctx.fillStyle="#00ffff";
        ctx.fill();

        ctx.shadowBlur=20;
        ctx.shadowColor="#00ffff";

        hud.innerHTML=`
        vx: ${electron.vx.toFixed(2)}<br>
        vy: ${electron.vy.toFixed(2)}
        `;

        requestAnimationFrame(loop);
    }

    loop();
}

/* ================= 2 磁场迷宫 ================= */

function initMagneticMaze(){

    let ball={
        x:450,
        y:250
    };

    window.onmousemove=(e)=>{

        const rect=canvas.getBoundingClientRect();

        let mx=e.clientX-rect.left;
        let my=e.clientY-rect.top;

        ball.x+=(mx-ball.x)*0.02;
        ball.y+=(my-ball.y)*0.02;
    };

    function loop(){

        if(currentGame!=="magnetic") return;

        ctx.fillStyle="#07111f";
        ctx.fillRect(0,0,900,500);

        ctx.beginPath();
        ctx.arc(ball.x,ball.y,20,0,Math.PI*2);
        ctx.fillStyle="red";
        ctx.fill();

        hud.innerHTML="移动鼠标控制磁力";

        requestAnimationFrame(loop);
    }

    loop();
}

/* ================= 3 法拉第 ================= */

function initFaraday(){

    let energy=0;

    window.onmousemove=(e)=>{
        energy+=0.5;
    };

    function loop(){

        if(currentGame!=="faraday") return;

        ctx.fillStyle="#07111f";
        ctx.fillRect(0,0,900,500);

        ctx.strokeStyle="#00ffff";
        ctx.lineWidth=5;

        for(let i=0;i<8;i++){

            ctx.beginPath();

            ctx.arc(
                450,
                250,
                30+i*15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }

        ctx.fillStyle="yellow";
        ctx.beginPath();
        ctx.arc(700,250,energy/10,0,Math.PI*2);
        ctx.fill();

        if(energy>100) energy=100;

        hud.innerHTML=`感应能量: ${energy.toFixed(0)}%`;

        requestAnimationFrame(loop);
    }

    loop();
}

/* ================= 4 粒子加速器 ================= */

function initAccelerator(){

    let angle=0;
    let speed=1;

    window.onkeydown=(e)=>{
        if(e.key===" ") speed+=0.3;
    };

    function loop(){

        if(currentGame!=="accelerator") return;

        ctx.fillStyle="#07111f";
        ctx.fillRect(0,0,900,500);

        ctx.beginPath();
        ctx.arc(450,250,150,0,Math.PI*2);
        ctx.strokeStyle="#00ffff";
        ctx.lineWidth=4;
        ctx.stroke();

        angle+=0.02*speed;

        let x=450+Math.cos(angle)*150;
        let y=250+Math.sin(angle)*150;

        ctx.beginPath();
        ctx.arc(x,y,10,0,Math.PI*2);
        ctx.fillStyle="#00ffff";
        ctx.fill();

        hud.innerHTML=`
        速度等级: ${speed.toFixed(1)}<br>
        按空格加速
        `;

        requestAnimationFrame(loop);
    }

    loop();
}

/* ================= 5 电磁炮 ================= */

function initRailgun(){

    let power=0;

    window.onkeydown=(e)=>{

        if(e.key===" "){
            power+=5;
        }

        if(e.key==="Enter"){
            fire();
        }
    };

    function fire(){

        let x=100;

        function shot(){

            if(currentGame!=="railgun") return;

            ctx.fillStyle="#07111f";
            ctx.fillRect(0,0,900,500);

            x+=power*0.5;

            ctx.fillStyle="#00ffff";
            ctx.fillRect(x,240,40,20);

            ctx.fillStyle="orange";
            ctx.fillRect(750,200,40,100);

            hud.innerHTML=`
            能量: ${power}<br>
            空格充能 ENTER发射
            `;

            if(x<900){
                requestAnimationFrame(shot);
            }
        }

        shot();
    }

    function loop(){

        if(currentGame!=="railgun") return;

        ctx.fillStyle="#07111f";
        ctx.fillRect(0,0,900,500);

        ctx.fillStyle="#00ffff";
        ctx.fillRect(50,230,100,40);

        ctx.fillStyle="gray";
        ctx.fillRect(50,245,200,10);

        hud.innerHTML=`
        能量: ${power}<br>
        空格充能 ENTER发射
        `;

        requestAnimationFrame(loop);
    }

    loop();
}

</script>

</body>
</html>
