<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>愤怒的电磁小鸟（稳定版）</title>

<style>
body{
    margin:0;
    display:flex;
    font-family:Arial;
    background:#0b1020;
    color:white;
}

/* 控制面板 */
#panel{
    width:340px;
    padding:12px;
    background:#0f172a;
}

canvas{
    background:#020617;
}

input{ width:100%; }

button{
    width:100%;
    margin-top:8px;
    padding:8px;
}

#nextBtn{
    background:#22c55e;
    display:none;
}

/* 开始界面 */
#startScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(#1e1b4b,#0b1020);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
}

/* 规则界面 */
#ruleScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#ruleBox{
    width:420px;
    background:#0f172a;
    padding:20px;
    border-radius:12px;
    line-height:1.6;
}

/* 通关 */
#win{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:32px;
}
</style>
</head>

<body>

<!-- 开始 -->
<div id="startScreen">
    <h1>🐦 愤怒的电磁小鸟</h1>
    <button onclick="startGame()">开始游戏</button>
</div>

<!-- 规则 -->
<div id="ruleScreen">
    <div id="ruleBox">
        <h2>📘 游戏规则</h2>

        <p>🎯 目标：用电磁力控制小鸟击中猪头</p>

        <p>⚡ 参数：</p>
        <ul>
            <li>q：电荷</li>
            <li>E：电场强度</li>
            <li>B：磁场强度</li>
            <li>vx / vy：初速度</li>
        </ul>

        <p>🧱 规则：</p>
        <ul>
            <li>撞墙会反弹</li>
            <li>必须绕过障碍</li>
            <li>击中猪头通关</li>
        </ul>

        <button onclick="closeRule()" style="
        width:100%;
        padding:10px;
        margin-top:10px;
        background:#22c55e;
        border:none;
        color:white;
        ">
        进入游戏
        </button>
    </div>
</div>

<!-- UI -->
<div id="panel">
<h2>⚡ 电磁控制</h2>

<button onclick="showRule()">📘 查看规则</button>

<label>q</label><input id="q" type="range" min="-2" max="2" step="0.1" value="1">
<label>E</label><input id="E" type="range" min="-2" max="2" step="0.1" value="1">
<label>B</label><input id="B" type="range" min="-2" max="2" step="0.1" value="1">
<label>vx</label><input id="vx" type="range" min="-8" max="8" step="0.1" value="4">
<label>vy</label><input id="vy" type="range" min="-8" max="8" step="0.1" value="-2">

<button onclick="launch()">▶ 发射</button>
<button onclick="resetLevel()">🔄 重置</button>
<button id="nextBtn" onclick="nextLevel()">➡ 下一关</button>
</div>

<canvas id="c"></canvas>

<!-- 通关 -->
<div id="win">
🎉 通关成功
<button onclick="restartGame()">重新开始</button>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=window.innerWidth-340;
c.height=window.innerHeight;

let level=1;
let running=false;
let gameStarted=false;

/* ================= 状态 ================= */
let bird={
    x:100,
    y:0,
    vx:0,
    vy:0,
    trail:[]
};

let pig={x:0,y:0,r:22};
let gates=[];
const dt=0.08;

/* ================= 电磁力 ================= */
function F(q,E,B,vx,vy){
    return {
        fx:q*(E + vy*B),
        fy:q*(0 - vx*B)
    };
}

function clamp(v){
    return Math.max(-10,Math.min(10,v));
}

/* ================= 规则系统 ================= */
function startGame(){
    document.getElementById("startScreen").style.display="none";
    showRule();
    gameStarted=true;
}

function showRule(){
    document.getElementById("ruleScreen").style.display="flex";
}

function closeRule(){
    document.getElementById("ruleScreen").style.display="none";
}

/* ================= 关卡 ================= */
function buildLevel(){

    gates=[];
    let W=c.width;
    let H=c.height;
    let mid=H/2;

    let startY=mid+(level-3)*50;

    pig={
        x:W-140,
        y:mid+(level%2===0?-1:1)*(60+level*8),
        r:22
    };

    let Sx=100;
    let Sy=startY;

    let dx=pig.x-Sx;
    let dy=pig.y-Sy;

    for(let i=1;i<=3;i++){

        let t=i/4;
        let x=Sx+dx*t;
        let y=Sy+dy*t;

        let gap=150-level*12;
        let jitter=Math.sin(i*2+level)*18;

        gates.push({
            x:x,
            top:y-gap+jitter,
            bottom:y+gap+jitter
        });
    }
}

/* ================= 碰撞 ================= */
function hitGate(x,y){
    for(let g of gates){
        if(Math.abs(x-g.x)<18){
            if(y<g.top || y>g.bottom) return true;
        }
    }
    return false;
}

function hitPig(x,y){
    return Math.hypot(x-pig.x,y-pig.y)<pig.r;
}

/* ================= 预测 ================= */
function preview(){

    let q=+qInput.value;
    let E=+EInput.value;
    let B=+BInput.value;

    let x=100;
    let y=c.height/2+(level-3)*50;
    let vx=+vxInput.value;
    let vy=+vyInput.value;

    ctx.beginPath();
    ctx.setLineDash([3,4]);
    ctx.moveTo(x,y);

    for(let i=0;i<55;i++){

        let f=F(q,E,B,vx,vy);

        vx=clamp(vx+f.fx*dt);
        vy=clamp(vy+f.fy*dt);

        x+=vx;
        y+=vy;

        if(hitGate(x,y)) break;

        ctx.lineTo(x,y);
    }

    ctx.strokeStyle="rgba(56,189,248,0.6)";
    ctx.stroke();
    ctx.setLineDash([]);
}

/* ================= 更新 ================= */
function update(){

    if(!running || !gameStarted) return;

    let q=+qInput.value;
    let E=+EInput.value;
    let B=+BInput.value;

    let f=F(q,E,B,bird.vx,bird.vy);

    bird.vx=clamp(bird.vx+f.fx*dt);
    bird.vy=clamp(bird.vy+f.fy*dt);

    let px=bird.x,py=bird.y;

    bird.x+=bird.vx;
    bird.y+=bird.vy;

    if(hitGate(bird.x,bird.y)){
        bird.x=px;
        bird.y=py;
        bird.vx*=-0.6;
        bird.vy*=-0.6;
    }

    bird.trail.push({x:bird.x,y:bird.y});
    if(bird.trail.length>120)bird.trail.shift();

    if(hitPig(bird.x,bird.y)){
        running=false;
        document.getElementById("nextBtn").style.display="block";
    }
}

/* ================= 高级小鸟（稳定版） ================= */
function drawBird(x,y){

    // 身体
    ctx.fillStyle="#ff3b30";
    ctx.beginPath();
    ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fill();

    // 白肚子
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x+2,y+3,5,0,Math.PI*2);
    ctx.fill();

    // 眼睛
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x+3,y-2,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(x+4,y-2,1.5,0,Math.PI*2);
    ctx.fill();

    // 眉毛
    ctx.strokeStyle="black";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x+1,y-6);
    ctx.lineTo(x+6,y-5);
    ctx.stroke();

    // 嘴
    ctx.fillStyle="#ffcc00";
    ctx.beginPath();
    ctx.moveTo(x+8,y);
    ctx.lineTo(x+14,y+2);
    ctx.lineTo(x+8,y+6);
    ctx.fill();
}

/* ================= 高级猪头 ================= */
function drawPig(x,y){

    ctx.fillStyle="#22c55e";
    ctx.beginPath();
    ctx.arc(x,y,22,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#16a34a";
    ctx.beginPath();
    ctx.ellipse(x,y+3,8,5,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(x-3,y+3,1.5,0,Math.PI*2);
    ctx.arc(x+3,y+3,1.5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x-6,y-6,3,0,Math.PI*2);
    ctx.arc(x+6,y-6,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(x-6,y-6,1.5,0,Math.PI*2);
    ctx.arc(x+6,y-6,1.5,0,Math.PI*2);
    ctx.fill();
}

/* ================= 绘制 ================= */
function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    ctx.fillStyle="#334155";
    for(let g of gates){
        ctx.fillRect(g.x-10,0,20,g.top);
        ctx.fillRect(g.x-10,g.bottom,20,c.height);
    }

    drawPig(pig.x,pig.y);
    preview();

    ctx.beginPath();
    for(let i=0;i<bird.trail.length;i++){
        ctx.lineTo(bird.trail[i].x,bird.trail[i].y);
    }
    ctx.strokeStyle="#fbbf24";
    ctx.stroke();

    drawBird(bird.x,bird.y);

    ctx.fillStyle="white";
    ctx.fillText("LEVEL "+level,20,20);
}

/* ================= loop ================= */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

/* ================= 控制 ================= */
function launch(){
    buildLevel();
    resetBird();
    running=true;
}

function resetLevel(){
    buildLevel();
    resetBird();
}

function nextLevel(){
    level++;
    if(level>5){
        document.getElementById("win").style.display="flex";
        return;
    }
    buildLevel();
    resetBird();
}

/* ================= 重置 ================= */
function resetBird(){
    bird.x=100;
    bird.y=c.height/2+(level-3)*50;
    bird.vx=+vxInput.value;
    bird.vy=+vyInput.value;
    bird.trail=[];
    running=false;
    document.getElementById("nextBtn").style.display="none";
}

/* ================= restart ================= */
function restartGame(){
    level=1;
    document.getElementById("win").style.display="none";
    buildLevel();
    resetBird();
}

/* ================= UI ================= */
const qInput=document.getElementById("q");
const EInput=document.getElementById("E");
const BInput=document.getElementById("B");
const vxInput=document.getElementById("vx");
const vyInput=document.getElementById("vy");

/* init */
buildLevel();
resetBird();
loop();
</script>

</body>
</html>
